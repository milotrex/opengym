# Pushes the Worker's secrets (SESSION_SECRET, the VAPID pair, ADMIN_UIDS) from GitHub repository
# secrets to Cloudflare. Run it by hand from the Actions tab; it never runs on push or on a pull
# request, so a fork's PR cannot reach these values.
#
# Secrets stay on the Worker across deploys, so this is only needed the first time and whenever
# you rotate one. Set these under Settings, Secrets and variables, Actions:
#   CLOUDFLARE_API_TOKEN    Account, Workers Scripts: Edit
#   CLOUDFLARE_ACCOUNT_ID   your account id
#   SESSION_SECRET          openssl rand -hex 32
#   VAPID_PUBLIC_KEY        npx web-push generate-vapid-keys  (optional, set both or neither)
#   VAPID_PRIVATE_KEY
#   ADMIN_UIDS              optional, comma-separated user ids
# Changing SESSION_SECRET signs everyone out. Changing the VAPID pair drops every push subscription.
name: Sync Worker secrets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-secrets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Push secrets to the Worker
        run: node scripts/sync-secrets.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          ADMIN_UIDS: ${{ secrets.ADMIN_UIDS }}
